<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f1ec" />
    <script>
      // Set the theme before first paint: a saved choice, otherwise the system's.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (error) {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#110c17" : "#f1f1ec");
      })();
    </script>
    <meta
      name="description"
      content="Mohammad Ryyan Rashid is an AI/ML engineer and software engineer building computer vision, machine learning and production systems."
    />
